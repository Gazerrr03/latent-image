name: Windows package and playthrough

on:
  workflow_dispatch:
  push:
    branches:
      - feature/story-text-polish
    paths:
      - .github/workflows/windows-package.yml
      - godot/**

permissions:
  contents: read

jobs:
  package-and-playthrough:
    runs-on: windows-latest
    steps:
      - name: Check out project and Git LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python for selective official template download
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export and run both full playthroughs on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '4.7.2'
          $godotArchive = Join-Path $env:RUNNER_TEMP "Godot_v${version}-stable_win64.exe.zip"
          $godotDir = Join-Path $env:RUNNER_TEMP "godot-${version}"
          $templateDir = Join-Path $env:APPDATA "Godot\export_templates\${version}.stable"
          $godotUrl = "https://github.com/godotengine/godot-builds/releases/download/${version}-stable/Godot_v${version}-stable_win64.exe.zip"

          Invoke-WebRequest -Uri $godotUrl -OutFile $godotArchive
          Expand-Archive -LiteralPath $godotArchive -DestinationPath $godotDir
          $godot = Get-ChildItem -Path $godotDir -File -Filter "Godot_v${version}-stable_win64*.exe" |
            Where-Object { $_.Name -notmatch '_console\.exe$' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $godot) { throw 'The official Godot Windows editor executable was not found.' }

          python godot/tools/fetch_export_template.py --platform windows-x86_64 --output-dir $templateDir

          $exportDir = Join-Path $env:GITHUB_WORKSPACE 'godot\export\windows'
          New-Item -ItemType Directory -Force -Path $exportDir | Out-Null
          $exePath = Join-Path $exportDir 'LatentImage.exe'
          $importLog = Join-Path $env:RUNNER_TEMP 'godot-import.log'
          & $godot --headless --editor --import --path (Join-Path $env:GITHUB_WORKSPACE 'godot') --quit --log-file $importLog
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path $importLog) { Get-Content -LiteralPath $importLog }
            throw "Godot resource import failed; see $importLog"
          }

          $exportLog = Join-Path $env:RUNNER_TEMP 'godot-export.log'
          & $godot --headless --path (Join-Path $env:GITHUB_WORKSPACE 'godot') --log-file $exportLog --export-release 'Windows Desktop' $exePath
          $exportExitCode = $LASTEXITCODE
          if ($exportExitCode -ne 0 -or -not (Test-Path $exePath)) {
            Write-Host "Godot export exit code: $exportExitCode"
            if (Test-Path $exportLog) { Get-Content -LiteralPath $exportLog }
            throw "Windows release export failed; see $exportLog"
          }

          function Invoke-Playthrough([string]$name, [string]$expectedEnding, [string[]]$userArgs) {
            $logPath = Join-Path $env:RUNNER_TEMP "playthrough-$name.log"
            $arguments = @('--headless', '--log-file', $logPath, '--', '--autoplay') + $userArgs
            $process = Start-Process -FilePath $exePath -ArgumentList $arguments -Wait -PassThru
            $log = [System.IO.File]::ReadAllText($logPath, [System.Text.Encoding]::UTF8)
            if ($process.ExitCode -ne 0) { throw "$name playthrough exited with $($process.ExitCode); see $logPath" }
            if (-not $log.Contains('结果：通过') -or -not $log.Contains('未成立 []') -or -not $log.Contains("讲法 $expectedEnding")) {
              throw "$name playthrough did not reach a valid complete ending; see $logPath"
            }
            Write-Host "$name playthrough passed: $expectedEnding"
          }

          Invoke-Playthrough 'protect' '保护' @()
          Invoke-Playthrough 'replace' '取代' @('--view=取代')

          $packageDir = Join-Path $env:RUNNER_TEMP 'LatentImage-Windows'
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item -LiteralPath $exePath -Destination (Join-Path $packageDir 'LatentImage.exe')
          @'
          潜影（Latent Image）Windows 版

          运行方式：解压后双击 LatentImage.exe。
          键盘操作：W/A/S/D 移动，鼠标转动视角，E 或鼠标左键调查，Shift 疾跑，Tab 或 I 打开证据板，Esc 打开设置。
          建议系统：Windows 10/11 64 位；首次启动需要支持 Vulkan 1.2 的显卡驱动。
          本包为未签名的本地评审构建。
          '@ | Set-Content -LiteralPath (Join-Path $packageDir 'README.txt') -Encoding utf8
          $packageZip = Join-Path $exportDir 'LatentImage-Windows.zip'
          Compress-Archive -Path (Join-Path $packageDir '*') -DestinationPath $packageZip -CompressionLevel NoCompression -Force

      - name: Upload Windows package and test logs
        uses: actions/upload-artifact@v4
        with:
          name: latentimage-windows-package
          path: |
            godot/export/windows/LatentImage-Windows.zip
            ${{ runner.temp }}\godot-import.log
            ${{ runner.temp }}\godot-export.log
            ${{ runner.temp }}\playthrough-protect.log
            ${{ runner.temp }}\playthrough-replace.log
          if-no-files-found: error
          retention-days: 7
