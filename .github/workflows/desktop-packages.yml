name: Desktop packages

on:
  workflow_dispatch:
  push:
    branches:
      - feature/story-text-polish
    paths:
      - .github/workflows/desktop-packages.yml
      - godot/**

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out project and Git LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python for selective official template download
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export Windows and macOS packages without running either game
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '4.7.2'
          $godotArchive = Join-Path $env:RUNNER_TEMP "Godot_v${version}-stable_win64.exe.zip"
          $godotDir = Join-Path $env:RUNNER_TEMP "godot-${version}"
          $templateDir = Join-Path $env:APPDATA "Godot\export_templates\${version}.stable"
          $godotUrl = "https://github.com/godotengine/godot-builds/releases/download/${version}-stable/Godot_v${version}-stable_win64.exe.zip"

          Invoke-WebRequest -Uri $godotUrl -OutFile $godotArchive
          Expand-Archive -LiteralPath $godotArchive -DestinationPath $godotDir
          $godot = Get-ChildItem -Path $godotDir -File -Filter "Godot_v${version}-stable_win64_console.exe" |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $godot) { throw 'The official Godot Windows console executable was not found.' }

          python godot/tools/fetch_export_template.py --platform windows-x86_64 --output-dir $templateDir
          python godot/tools/fetch_export_template.py --platform macos-universal --output-dir $templateDir

          $projectDir = Join-Path $env:GITHUB_WORKSPACE 'godot'
          $exportRoot = Join-Path $projectDir 'export'
          $windowsDir = Join-Path $exportRoot 'windows'
          $macDir = Join-Path $exportRoot 'macos'
          New-Item -ItemType Directory -Force -Path $windowsDir, $macDir | Out-Null
          $importLog = Join-Path $env:RUNNER_TEMP 'godot-import.log'
          & $godot --headless --verbose --editor --import --path $projectDir --quit --log-file $importLog
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path $importLog) { Get-Content -LiteralPath $importLog }
            throw "Godot resource import failed; see $importLog"
          }

          $windowsExe = Join-Path $windowsDir 'LatentImage.exe'
          $windowsLog = Join-Path $env:RUNNER_TEMP 'godot-export-windows.log'
          & $godot --headless --verbose --path $projectDir --log-file $windowsLog --export-release 'Windows Desktop' $windowsExe
          $exportExitCode = $LASTEXITCODE
          if ($exportExitCode -ne 0 -or -not (Test-Path $windowsExe)) {
            Write-Host "Windows export exit code: $exportExitCode"
            if (Test-Path $windowsLog) { Get-Content -LiteralPath $windowsLog }
            throw "Windows release export failed; see $windowsLog"
          }

          $windowsPackageDir = Join-Path $env:RUNNER_TEMP 'LatentImage-Windows'
          New-Item -ItemType Directory -Force -Path $windowsPackageDir | Out-Null
          Copy-Item -LiteralPath $windowsExe -Destination (Join-Path $windowsPackageDir 'LatentImage.exe')
          @'
          潜影（Latent Image）Windows 版

          运行方式：解压后双击 LatentImage.exe。
          键盘操作：W/A/S/D 移动，鼠标转动视角，E 或鼠标左键调查，Shift 疾跑，Tab 或 I 打开证据板，Esc 打开设置。
          建议系统：Windows 10/11 64 位；首次启动需要支持 Vulkan 1.2 的显卡驱动。
          本包为未签名的本地评审构建。
          '@ | Set-Content -LiteralPath (Join-Path $windowsPackageDir 'README.txt') -Encoding utf8
          $windowsZip = Join-Path $windowsDir 'LatentImage-Windows.zip'
          Compress-Archive -Path (Join-Path $windowsPackageDir '*') -DestinationPath $windowsZip -CompressionLevel NoCompression -Force

          $macZip = Join-Path $macDir 'LatentImage-Mac-raw.zip'
          $macLog = Join-Path $env:RUNNER_TEMP 'godot-export-macos.log'
          & $godot --headless --verbose --path $projectDir --log-file $macLog --export-release 'macOS Universal' $macZip
          $exportExitCode = $LASTEXITCODE
          if ($exportExitCode -ne 0 -or -not (Test-Path $macZip)) {
            Write-Host "macOS export exit code: $exportExitCode"
            if (Test-Path $macLog) { Get-Content -LiteralPath $macLog }
            throw "macOS release export failed; see $macLog"
          }

      - name: Upload Windows package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latentimage-windows-package
          path: godot/export/windows/LatentImage-Windows.zip
          if-no-files-found: warn
          retention-days: 7

      - name: Upload macOS package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latentimage-macos-raw-package
          path: godot/export/macos/LatentImage-Mac-raw.zip
          if-no-files-found: warn
          retention-days: 7

      - name: Upload export logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latentimage-export-logs
          path: |
            ${{ runner.temp }}\godot-import.log
            ${{ runner.temp }}\godot-export-windows.log
            ${{ runner.temp }}\godot-export-macos.log
          if-no-files-found: warn
          retention-days: 7

  test-macos:
    name: Test macOS package on Apple Silicon
    needs: package
    if: needs.package.result == 'success'
    runs-on: macos-latest
    steps:
      - name: Download raw macOS export
        uses: actions/download-artifact@v4
        with:
          name: latentimage-macos-raw-package
          path: ${{ runner.temp }}/macos-raw

      - name: Package and play through both macOS routes
        shell: bash
        run: |
          set -euo pipefail
          extract_dir="$RUNNER_TEMP/macos-raw-extracted"
          package_dir="$RUNNER_TEMP/LatentImage-Mac"
          verify_dir="$RUNNER_TEMP/macos-package-verify"
          mac_zip="$RUNNER_TEMP/LatentImage-Mac.zip"
          mkdir -p "$extract_dir" "$package_dir" "$verify_dir"
          ditto -x -k "$RUNNER_TEMP/macos-raw/LatentImage-Mac-raw.zip" "$extract_dir"
          app_path="$(find "$extract_dir" -maxdepth 2 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo 'The macOS archive did not contain an app bundle.'
            find "$extract_dir" -maxdepth 3 -print
            exit 1
          fi
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          app_binary="$app_path/Contents/MacOS/$executable"
          if [[ ! -x "$app_binary" ]]; then
            echo "The exported executable is missing or lacks its executable flag: $app_binary"
            ls -l "$app_path/Contents/MacOS"
            exit 1
          fi
          ditto "$app_path" "$package_dir/$(basename "$app_path")"
          cat > "$package_dir/README.txt" <<'EOF'
          潜影（Latent Image）macOS 版

          运行方式：双击应用包启动。
          键盘操作：W/A/S/D 移动，鼠标转动视角，E 或鼠标左键调查，Shift 疾跑，Tab 或 I 打开证据板，Esc 打开设置。
          本应用为 Universal 2 构建，包含 Intel 与 Apple Silicon 架构。
          本评审包使用 ad-hoc 签名，未经过 Apple Developer ID 公证；macOS 可能要求用户手动确认首次打开。
          EOF
          ditto -c -k --sequesterRsrc --keepParent "$package_dir" "$mac_zip"
          ditto -x -k "$mac_zip" "$verify_dir"
          packaged_app="$(find "$verify_dir" -type d -name '*.app' -print -quit)"
          if [[ -z "$packaged_app" ]]; then
            echo 'The final macOS package did not contain an app bundle.'
            find "$verify_dir" -maxdepth 4 -print
            exit 1
          fi
          packaged_executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$packaged_app/Contents/Info.plist")"
          app_binary="$packaged_app/Contents/MacOS/$packaged_executable"
          if [[ ! -x "$app_binary" ]]; then
            echo "The final package lost the executable flag: $app_binary"
            ls -l "$packaged_app/Contents/MacOS"
            exit 1
          fi

          run_route() {
            local route="$1"
            local expected_ending="$2"
            shift 2
            local log="$RUNNER_TEMP/playthrough-$route.log"
            local stdout_log="$RUNNER_TEMP/playthrough-$route.stdout.log"
            set +e
            "$app_binary" --headless --log-file "$log" -- --autoplay "$@" >"$stdout_log" 2>&1
            local exit_code=$?
            set -e
            cat "$stdout_log" "$log"
            if [[ "$exit_code" -ne 0 ]]; then
              echo "$route route exited with $exit_code"
              return 1
            fi
            if ! grep -Fq '结果：通过' "$stdout_log" "$log"; then
              echo "$route route did not report a successful result"
              return 1
            fi
            if ! grep -Fq '未成立 []' "$stdout_log" "$log"; then
              echo "$route route left unresolved deductions"
              return 1
            fi
            if ! grep -Fq "讲法 $expected_ending" "$stdout_log" "$log"; then
              echo "$route route did not reach the expected ending: $expected_ending"
              return 1
            fi
            echo "$route route passed: $expected_ending"
          }

          run_route protect '保护'
          run_route replace '取代' --view=取代

      - name: Upload final macOS package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latentimage-macos-package
          path: ${{ runner.temp }}/LatentImage-Mac.zip
          if-no-files-found: warn
          retention-days: 7

      - name: Upload macOS playthrough logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latentimage-macos-playthrough-logs
          path: |
            ${{ runner.temp }}/playthrough-protect.log
            ${{ runner.temp }}/playthrough-protect.stdout.log
            ${{ runner.temp }}/playthrough-replace.log
            ${{ runner.temp }}/playthrough-replace.stdout.log
          if-no-files-found: warn
          retention-days: 7
