<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1800" viewBox="0 0 1500 1800">
  <defs>
    <pattern id="fiber" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 7 L7 0" stroke="#7a5c3a" stroke-width="0.35" opacity="0.08"/>
      <circle cx="2" cy="3" r="0.45" fill="#6a4b32" opacity="0.09"/>
    </pattern>
    <radialGradient id="paperWash" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#f5ead5"/>
      <stop offset="0.72" stop-color="#ede0c8"/>
      <stop offset="1" stop-color="#e2d1b4"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d573b"/>
      <stop offset="0.45" stop-color="#5f412d"/>
      <stop offset="1" stop-color="#4a3225"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f4ea" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#b9cbc8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7d9695" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <style>
      .ink { fill:#3b2d23; }
      .muted { fill:#6e5b47; }
      .red { fill:#8a3f32; }
      .title { font-family:"KaiTi","STKaiti","SimSun",serif; font-size:54px; font-weight:700; letter-spacing:3px; }
      .sub { font-family:"KaiTi","STKaiti","SimSun",serif; font-size:25px; letter-spacing:2px; }
      .seat { font-family:"KaiTi","STKaiti","SimSun",serif; font-size:27px; font-weight:700; }
      .detail { font-family:"KaiTi","STKaiti","SimSun",serif; font-size:19px; }
      .small { font-family:"KaiTi","STKaiti","SimSun",serif; font-size:17px; }
      .legend { font-family:"KaiTi","STKaiti","SimSun",serif; font-size:18px; }
      .num { font-family:Georgia,"Times New Roman",serif; font-size:22px; letter-spacing:2px; }
      .labelbox { fill:#f2e5cd; fill-opacity:0.78; stroke:#8e7355; stroke-width:1; }
      .plateShadow { fill:#2d1e17; opacity:0.22; filter:url(#soft); }
      .silver { fill:none; stroke:#b8b0a1; stroke-width:4; stroke-linecap:round; }
      .silverThin { fill:none; stroke:#a79c8b; stroke-width:2; stroke-linecap:round; }
      .linen { fill:#eadfc9; stroke:#9d8b73; stroke-width:1.2; }
      .fold { fill:none; stroke:#b6a58c; stroke-width:1; }
      .woodline { fill:none; stroke:#c19a6a; stroke-width:1; opacity:0.24; }
    </style>
  </defs>

  <!-- paper -->
  <rect width="1500" height="1800" fill="url(#paperWash)"/>
  <rect width="1500" height="1800" fill="url(#fiber)"/>
  <rect x="32" y="32" width="1436" height="1736" fill="none" stroke="#5d4633" stroke-width="2"/>
  <rect x="42" y="42" width="1416" height="1716" fill="none" stroke="#a37d4c" stroke-width="0.8" opacity="0.7"/>

  <!-- header -->
  <g class="ink">
    <text x="88" y="105" class="title">1924 · 餐桌摆放图</text>
    <text x="90" y="145" class="sub muted">奥瑞尔庄园 · 从上方看 · 五个位置</text>
  </g>
  <g transform="translate(1310 92) rotate(5)">
    <rect x="-68" y="-34" width="136" height="68" fill="#f2e5cd" stroke="#8a3f32" stroke-width="2" opacity="0.9"/>
    <text x="0" y="-4" text-anchor="middle" class="num red">1924</text>
    <text x="0" y="20" text-anchor="middle" class="small red">L. 的位子</text>
  </g>
  <g transform="translate(1370 220)">
    <circle r="30" fill="none" stroke="#6e5b47" stroke-width="1.2"/>
    <path d="M0 -24 L7 0 L0 24 L-7 0 Z" fill="#8a3f32" opacity="0.85"/>
    <text y="-38" text-anchor="middle" class="small muted">北</text>
  </g>

  <!-- table -->
  <g>
    <rect x="470" y="380" width="560" height="980" rx="28" fill="#2b1c14" opacity="0.25" filter="url(#soft)"/>
    <rect x="462" y="372" width="576" height="996" rx="30" fill="#3a261b" opacity="0.55"/>
    <rect x="480" y="390" width="540" height="960" rx="24" fill="url(#wood)" stroke="#2f2017" stroke-width="5"/>
    <rect x="500" y="410" width="500" height="920" rx="18" fill="none" stroke="#c19a6a" stroke-width="2" opacity="0.5"/>
    <path d="M530 430 C690 470 690 1240 530 1300" class="woodline"/>
    <path d="M580 420 C820 500 820 1240 580 1320" class="woodline"/>
    <path d="M690 420 C910 520 910 1210 690 1320" class="woodline"/>
    <path d="M860 420 C980 520 980 1210 860 1320" class="woodline"/>
    <!-- centerpiece -->
    <g opacity="0.95">
      <ellipse cx="750" cy="890" rx="58" ry="76" fill="#d9c7a8" stroke="#8e7355" stroke-width="2"/>
      <ellipse cx="750" cy="868" rx="44" ry="30" fill="#6e7b5a"/>
      <circle cx="726" cy="858" r="14" fill="#b77b63" opacity="0.9"/>
      <circle cx="748" cy="842" r="13" fill="#d4b56f" opacity="0.9"/>
      <circle cx="772" cy="858" r="15" fill="#9b5f58" opacity="0.9"/>
      <path d="M750 940 L750 930 M718 952 Q750 930 782 952" fill="none" stroke="#6e5b47" stroke-width="2"/>
      <text x="750" y="990" text-anchor="middle" class="small muted">桌花</text>
    </g>
    <g transform="translate(610 890)">
      <rect x="-5" y="-38" width="10" height="76" fill="#b08a45" opacity="0.8"/>
      <path d="M-18 38 L0 18 L18 38" fill="none" stroke="#b08a45" stroke-width="3"/>
      <rect x="-4" y="-58" width="8" height="22" fill="#efe3cc" stroke="#8e7355" stroke-width="1"/>
      <path d="M0 -66 C-5 -76 7 -82 0 -94" fill="none" stroke="#8a3f32" stroke-width="2"/>
    </g>
    <g transform="translate(890 890)">
      <rect x="-5" y="-38" width="10" height="76" fill="#b08a45" opacity="0.8"/>
      <path d="M-18 38 L0 18 L18 38" fill="none" stroke="#b08a45" stroke-width="3"/>
      <rect x="-4" y="-58" width="8" height="22" fill="#efe3cc" stroke="#8e7355" stroke-width="1"/>
      <path d="M0 -66 C5 -76 -7 -82 0 -94" fill="none" stroke="#8a3f32" stroke-width="2"/>
    </g>
  </g>

  <!-- north / ambrose -->
  <g transform="translate(750 470)">
    <circle cx="7" cy="10" r="64" class="plateShadow"/>
    <circle r="58" fill="#f1e8d9" stroke="#4f6b7a" stroke-width="7"/>
    <circle r="42" fill="none" stroke="#8fa2a9" stroke-width="2"/>
    <circle r="30" fill="#e7dfd0" stroke="#c0b39f" stroke-width="1"/>
    <path d="M-80 -24 C-96 -24 -96 34 -80 34 M80 -24 C96 -24 96 34 80 34" class="silver"/>
    <path d="M-68 -34 L-68 40 M-61 -34 L-61 40 M68 -34 L68 40" class="silverThin"/>
    <g transform="translate(88 -34)">
      <path d="M-14 -28 L14 -28 L10 24 L-10 24 Z" fill="url(#glass)" stroke="#7d9695" stroke-width="2"/>
      <path d="M-10 -18 L8 -18" stroke="#ffffff" stroke-width="2" opacity="0.65"/>
      <ellipse cx="0" cy="-28" rx="14" ry="4" fill="none" stroke="#7d9695" stroke-width="1.5"/>
    </g>
    <g transform="translate(-92 -34)">
      <rect x="-25" y="-18" width="50" height="42" rx="3" class="linen"/>
      <path d="M-15 -18 L-15 24 M5 -18 L5 24" class="fold"/>
    </g>
  </g>
  <g class="ink">
    <text x="750" y="292" text-anchor="middle" class="seat">北端 · 安布罗斯</text>
    <text x="750" y="322" text-anchor="middle" class="detail muted">蓝边大盘 · 玻璃杯 · 白餐巾</text>
  </g>

  <!-- south / lucien -->
  <g transform="translate(750 1280)">
    <circle cx="7" cy="10" r="56" class="plateShadow"/>
    <circle r="50" fill="#f0e4cf" stroke="#8c5a43" stroke-width="5"/>
    <circle r="36" fill="none" stroke="#b99a7e" stroke-width="2"/>
    <path d="M-40 -28 L-16 -8 L-20 22" fill="none" stroke="#7c5b45" stroke-width="2.5"/>
    <path d="M-4 -39 L12 -20" fill="none" stroke="#7c5b45" stroke-width="2"/>
    <circle cx="-30" cy="18" r="2.5" fill="#8c5a43"/>
    <path d="M-70 -20 C-84 -20 -84 28 -70 28 M70 -20 C84 -20 84 28 70 28" class="silverThin"/>
    <path d="M-60 -30 L-60 34 M60 -30 L60 34" class="silverThin"/>
    <g transform="translate(82 -34)">
      <path d="M-14 -8 L14 -8 L11 24 L-11 24 Z" fill="#b9b6ab" stroke="#746f64" stroke-width="2"/>
      <path d="M-14 -8 L-2 -2 L14 -8" fill="none" stroke="#746f64" stroke-width="2"/>
      <path d="M-10 -4 L8 -4" stroke="#f4efe2" stroke-width="1.5" opacity="0.6"/>
    </g>
    <g transform="translate(-88 32)">
      <rect x="-25" y="-18" width="50" height="42" rx="3" class="linen"/>
      <text x="0" y="7" text-anchor="middle" class="num red">L.</text>
    </g>
  </g>
  <g class="ink">
    <text x="750" y="1452" text-anchor="middle" class="seat">南端 · L. / 卢西恩</text>
    <text x="750" y="1482" text-anchor="middle" class="detail muted">修补旧盘 · 锡杯 · 绣 L. 的餐巾</text>
  </g>

  <!-- west / gideon -->
  <g transform="translate(570 880)">
    <circle cx="7" cy="10" r="62" class="plateShadow"/>
    <circle r="55" fill="#eadfc8" stroke="#775b3e" stroke-width="9"/>
    <circle r="38" fill="none" stroke="#a88c6d" stroke-width="2"/>
    <path d="M-78 -24 C-92 -24 -92 30 -78 30 M78 -24 C92 -24 92 30 78 30" class="silverThin"/>
    <path d="M-66 -30 L-66 36 M58 -30 L58 36" class="silverThin"/>
    <g transform="translate(82 -34)">
      <path d="M-18 -22 L14 -22 L11 24 L-15 24 Z" fill="#9a7b55" stroke="#624c35" stroke-width="2"/>
      <path d="M14 -12 C34 -12 34 12 14 12" fill="none" stroke="#624c35" stroke-width="4"/>
      <path d="M-12 -14 L8 -14" stroke="#d5c09b" stroke-width="2" opacity="0.7"/>
    </g>
    <g transform="translate(-78 34)">
      <rect x="-24" y="-17" width="48" height="38" rx="3" class="linen"/>
      <path d="M-12 -17 L-4 21 M8 -17 L12 21" class="fold"/>
    </g>
  </g>
  <g>
    <rect x="118" y="820" width="336" height="94" rx="3" fill="#f2e5cd" fill-opacity="0.78" stroke="#8e7355" stroke-width="1"/>
    <text x="142" y="850" class="seat ink">西侧 · 吉迪恩</text>
    <text x="142" y="878" class="detail muted">棕边厚盘 · 锡制杯</text>
    <text x="142" y="902" class="detail muted">素餐巾</text>
  </g>

  <!-- east 1 / constance -->
  <g transform="translate(930 700)">
    <circle cx="7" cy="10" r="58" class="plateShadow"/>
    <circle r="52" fill="#f1e8d8" stroke="#b08a45" stroke-width="4"/>
    <circle r="38" fill="none" stroke="#cdb37d" stroke-width="2"/>
    <path d="M-74 -24 C-88 -24 -88 30 -74 30 M74 -24 C88 -24 88 30 74 30" class="silver"/>
    <path d="M-62 -30 L-62 36 M62 -30 L62 36" class="silverThin"/>
    <g transform="translate(-84 -38)">
      <ellipse cx="0" cy="8" rx="23" ry="15" fill="#eee4d5" stroke="#b08a45" stroke-width="2"/>
      <path d="M-23 4 L-23 16 M-12 14 L-4 14 M4 14 L12 14" fill="none" stroke="#b08a45" stroke-width="1.2"/>
      <path d="M23 4 C38 4 38 20 22 20" fill="none" stroke="#b08a45" stroke-width="3"/>
      <ellipse cx="0" cy="-8" rx="20" ry="8" fill="#d6b98b" opacity="0.8"/>
    </g>
    <g transform="translate(82 34)">
      <rect x="-24" y="-17" width="48" height="38" rx="3" class="linen"/>
      <path d="M-12 -17 L-4 21 M8 -17 L12 21" class="fold"/>
    </g>
  </g>
  <g class="ink">
    <text x="1118" y="678" class="seat">东一 · 康斯坦斯</text>
    <text x="1118" y="708" class="detail muted">金边盘 · 茶杯 · 白餐巾</text>
  </g>

  <!-- east 2 / iris -->
  <g transform="translate(930 1040)">
    <circle cx="7" cy="10" r="50" class="plateShadow"/>
    <circle r="44" fill="#f5eadb" stroke="#8a6d63" stroke-width="4"/>
    <circle r="31" fill="none" stroke="#c6a69a" stroke-width="1.5"/>
    <g fill="#a97477" opacity="0.75">
      <circle cx="-20" cy="-15" r="3"/><circle cx="-7" cy="-23" r="3"/><circle cx="8" cy="-19" r="3"/>
      <circle cx="21" cy="-9" r="3"/><circle cx="-23" cy="4" r="3"/><circle cx="-6" cy="10" r="3"/>
      <circle cx="12" cy="5" r="3"/><circle cx="22" cy="16" r="3"/><circle cx="-12" cy="23" r="3"/>
    </g>
    <path d="M-62 -20 C-74 -20 -74 26 -62 26 M62 -20 C74 -20 74 26 62 26" class="silverThin"/>
    <path d="M-52 -26 L-52 30" class="silverThin"/>
    <g transform="translate(68 -34)">
      <ellipse cx="0" cy="8" rx="18" ry="12" fill="#f2e8d8" stroke="#8a6d63" stroke-width="2"/>
      <path d="M18 4 C30 4 30 18 17 18" fill="none" stroke="#8a6d63" stroke-width="2.5"/>
      <ellipse cx="0" cy="-3" rx="15" ry="5" fill="#d8c4b4" opacity="0.8"/>
    </g>
    <g transform="translate(-70 32)">
      <rect x="-22" y="-16" width="44" height="34" rx="3" class="linen"/>
      <text x="0" y="6" text-anchor="middle" class="num red">I.</text>
    </g>
  </g>
  <g class="ink">
    <text x="1118" y="1018" class="seat">东二 · 艾瑞斯</text>
    <text x="1118" y="1048" class="detail muted">碎花小盘 · 小杯 · I. 餐巾</text>
  </g>

  <!-- legend -->
  <g transform="translate(88 1560)">
    <text x="0" y="0" class="sub ink">盘沿辨认</text>
    <line x1="0" y1="18" x2="1324" y2="18" stroke="#8e7355" stroke-width="1" opacity="0.6"/>
    <g transform="translate(42 58)">
      <circle r="24" fill="#f1e8d9" stroke="#4f6b7a" stroke-width="5"/>
      <text y="48" text-anchor="middle" class="legend ink">蓝边大盘</text>
    </g>
    <g transform="translate(310 58)">
      <circle r="24" fill="#f1e8d8" stroke="#b08a45" stroke-width="3"/>
      <text y="48" text-anchor="middle" class="legend ink">金边盘</text>
    </g>
    <g transform="translate(570 58)">
      <circle r="20" fill="#f5eadb" stroke="#8a6d63" stroke-width="3"/>
      <circle cx="-8" cy="-5" r="2" fill="#a97477"/><circle cx="6" cy="4" r="2" fill="#a97477"/>
      <text y="48" text-anchor="middle" class="legend ink">碎花小盘</text>
    </g>
    <g transform="translate(830 58)">
      <circle r="24" fill="#eadfc8" stroke="#775b3e" stroke-width="7"/>
      <text y="48" text-anchor="middle" class="legend ink">棕边厚盘</text>
    </g>
    <g transform="translate(1100 58)">
      <circle r="22" fill="#f0e4cf" stroke="#8c5a43" stroke-width="4"/>
      <path d="M-18 -12 L-8 -2 L-12 12" fill="none" stroke="#7c5b45" stroke-width="2"/>
      <text y="48" text-anchor="middle" class="legend ink">修补旧盘</text>
    </g>
  </g>
  <g transform="translate(88 1690)" class="ink">
    <text x="0" y="0" class="legend">杯形与餐巾：玻璃杯 · 茶杯 · 小杯 · 锡制杯 · 锡杯；餐巾首字母 I. / L.</text>
    <text x="0" y="34" class="legend muted">先看位置，再看盘沿、杯形和首字母。</text>
  </g>

  <!-- footer -->
  <text x="750" y="1760" text-anchor="middle" class="small muted">奥瑞尔庄园 · 1924 年早餐 · 安布罗斯的私人餐桌草图</text>
</svg>
