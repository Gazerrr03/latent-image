<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2500" viewBox="0 0 1800 2500">
  <defs>
    <pattern id="paperFiber" width="9" height="9" patternUnits="userSpaceOnUse">
      <path d="M0 9 L9 0" stroke="#7c5d3e" stroke-width="0.35" opacity="0.075"/>
      <circle cx="3" cy="4" r="0.5" fill="#6b4b31" opacity="0.08"/>
    </pattern>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 L0 0 L0 30" fill="none" stroke="#6c5a45" stroke-width="0.5" opacity="0.055"/>
    </pattern>
    <radialGradient id="paper" cx="48%" cy="38%" r="80%">
      <stop offset="0" stop-color="#f7efde"/>
      <stop offset="0.7" stop-color="#efe2c9"/>
      <stop offset="1" stop-color="#e4d2b3"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c49b6c"/>
      <stop offset="0.45" stop-color="#b08559"/>
      <stop offset="1" stop-color="#946b47"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d7d2c5"/>
      <stop offset="0.5" stop-color="#a9a294"/>
      <stop offset="1" stop-color="#e0dbce"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f8ed" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#c6d6d2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#829b9a" stop-opacity="0.48"/>
    </linearGradient>
    <linearGradient id="pewter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8c4b7"/>
      <stop offset="0.5" stop-color="#8f8b80"/>
      <stop offset="1" stop-color="#b9b4a8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <style>
      .ink { fill:#3b2c20; }
      .muted { fill:#705c45; }
      .red { fill:#8a3f32; }
      .blue { fill:#3f6579; }
      .gold { fill:#a9803e; }
      .title { font-family:"Georgia","Times New Roman",serif; font-size:28px; letter-spacing:4px; font-weight:700; }
      .titleCn { font-family:"KaiTi","STKaiti","SimSun",serif; font-size:35px; letter-spacing:4px; font-weight:700; }
      .sub { font-family:"KaiTi","STKaiti","SimSun",serif; font-size:17px; letter-spacing:1.5px; }
      .seat { font-family:"KaiTi","STKaiti","SimSun",serif; font-size:19px; font-weight:700; letter-spacing:1px; }
      .detail { font-family:"KaiTi","STKaiti","SimSun",serif; font-size:14px; letter-spacing:0.6px; }
      .tag { font-family:"KaiTi","STKaiti","SimSun",serif; font-size:13px; letter-spacing:0.5px; }
      .legend { font-family:"KaiTi","STKaiti","SimSun",serif; font-size:15px; }
      .initial { font-family:"Georgia","Times New Roman",serif; font-size:16px; font-weight:700; }
      .plateShadow { fill:#4b3324; opacity:0.22; filter:url(#shadow); }
      .silver { fill:none; stroke:url(#silver); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .silverThin { fill:none; stroke:#9f9788; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
      .linen { fill:#f2e9d8; stroke:#a08a6e; stroke-width:1.1; }
      .fold { fill:none; stroke:#b6a58d; stroke-width:0.9; }
      .woodgrain { fill:none; stroke:#765232; stroke-width:0.8; opacity:0.16; }
      .labelBox { fill:#f6ecd8; fill-opacity:0.85; stroke:#8e7355; stroke-width:1; }
      .stamp { fill:#8a3f32; opacity:0.8; }
    </style>

    <!-- cutlery -->
    <g id="fork">
      <path d="M0 -38 L0 36" class="silver"/>
      <path d="M-10 -38 L-10 -15 M-4 -38 L-4 -15 M4 -38 L4 -15 M10 -38 L10 -15" class="silverThin"/>
      <path d="M-10 -15 C-10 -8 10 -8 10 -15" class="silverThin"/>
      <path d="M-5 36 L0 44 L5 36" class="silverThin"/>
    </g>
    <g id="knife">
      <path d="M0 -42 L0 38" class="silver"/>
      <path d="M-5 -42 C14 -28 14 2 -5 12 L-5 -42 Z" fill="#c7c1b3" stroke="#8e8779" stroke-width="1.2"/>
      <path d="M-2 -38 L7 -25" class="silverThin"/>
      <path d="M-5 38 L0 45 L5 38" class="silverThin"/>
    </g>
    <g id="spoon">
      <path d="M0 -28 L0 38" class="silver"/>
      <ellipse cx="0" cy="-20" rx="9" ry="16" fill="#c8c2b4" stroke="#8e8779" stroke-width="1.2"/>
      <path d="M-5 38 L0 45 L5 38" class="silverThin"/>
    </g>

    <!-- cups, all top view -->
    <g id="tumbler">
      <circle r="25" fill="#5e4b38" opacity="0.18" filter="url(#shadow)"/>
      <circle r="21" fill="url(#glass)" stroke="#809493" stroke-width="2.5"/>
      <circle r="15" fill="none" stroke="#e9efe7" stroke-width="1.4" opacity="0.9"/>
      <path d="M-14 -9 L14 9 M-14 9 L14 -9 M-11 -15 L11 15" fill="none" stroke="#ffffff" stroke-width="1.1" opacity="0.55"/>
      <circle r="7" fill="#c7d6d1" opacity="0.45"/>
    </g>
    <g id="teacup">
      <circle r="34" fill="#f0e7d7" stroke="#a78c63" stroke-width="1.5"/>
      <circle r="27" fill="none" stroke="#c5ae87" stroke-width="1"/>
      <circle r="21" fill="#f7efdf" stroke="#a9803e" stroke-width="2.2"/>
      <circle r="15" fill="#c9a46c" opacity="0.42"/>
      <path d="M21 -8 C39 -8 39 12 21 12" fill="none" stroke="#a9803e" stroke-width="3"/>
      <path d="M-12 2 Q0 -5 12 2" fill="none" stroke="#d1b180" stroke-width="1.1"/>
    </g>
    <g id="smallcup">
      <circle r="26" fill="#f3eadb" stroke="#a08a72" stroke-width="1.2"/>
      <circle r="19" fill="#f8f0e2" stroke="#8a6d63" stroke-width="1.7"/>
      <circle r="13" fill="#d8c3b2" opacity="0.55"/>
      <path d="M19 -6 C32 -6 32 10 18 10" fill="none" stroke="#8a6d63" stroke-width="2.4"/>
    </g>
    <g id="tankard">
      <circle r="24" fill="url(#pewter)" stroke="#68645b" stroke-width="2.5"/>
      <circle r="16" fill="#aaa699" stroke="#6e6a60" stroke-width="1.2"/>
      <path d="M20 -8 C42 -8 42 14 20 14" fill="none" stroke="#67635a" stroke-width="5"/>
      <path d="M-12 -8 L12 -8 M-12 8 L12 8" stroke="#d3cec1" stroke-width="1.2" opacity="0.7"/>
    </g>
    <g id="tincup">
      <path d="M-18 -16 C-8 -21 9 -19 18 -15 L16 16 C8 20 -8 20 -16 16 Z" fill="#b7b2a5" stroke="#716d63" stroke-width="2"/>
      <path d="M-15 -9 C-8 -12 8 -12 15 -9" fill="none" stroke="#e4dfd2" stroke-width="1.1" opacity="0.8"/>
      <path d="M-14 9 C-4 12 7 11 14 8" fill="none" stroke="#716d63" stroke-width="1.2"/>
      <path d="M12 -16 L18 -10 L13 -6" fill="none" stroke="#716d63" stroke-width="1.6"/>
      <path d="M-10 2 L-6 16" stroke="#8d887d" stroke-width="1" opacity="0.7"/>
    </g>
    <g id="breadplate">
      <circle r="29" fill="#f3ebdc" stroke="#b4a28b" stroke-width="1.2"/>
      <circle r="21" fill="none" stroke="#cbbba4" stroke-width="1"/>
      <path d="M-12 -10 L13 10" stroke="#9e9688" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </defs>

