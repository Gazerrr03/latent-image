<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" font-family="Microsoft YaHei, Noto Sans SC, sans-serif">
  <rect width="1200" height="880" fill="#f7f4ee"/>

  <text x="60" y="58" font-size="30" fill="#2b2b2b">暗房 · 药柜柜位图　<tspan font-size="20" fill="#6b6b6b">ded_cabinet（正面视图，柜段约 1.2 m）</tspan></text>
  <text x="60" y="88" font-size="15" fill="#7a7a7a">7 个圈：①②③④⑤ 有瓶，⑥⑦ 空位。④ 底下两个圈（深 + 淡），相隔约一指（0.02 m）。</text>

  <!-- 柜体 -->
  <rect x="120" y="120" width="960" height="620" fill="#8a6b4f" stroke="#4a3626" stroke-width="3"/>
  <!-- 层板 -->
  <line x1="120" y1="326" x2="1080" y2="326" stroke="#4a3626" stroke-width="6"/>
  <line x1="120" y1="532" x2="1080" y2="532" stroke="#4a3626" stroke-width="6"/>
  <!-- 层标签 -->
  <text x="132" y="152" font-size="15" fill="#f0e5d6">上层</text>
  <text x="132" y="358" font-size="15" fill="#f0e5d6">中层</text>
  <text x="132" y="564" font-size="15" fill="#f0e5d6">下层</text>

  <!-- 通用瓶子组：上层 ①②③ -->
  <!-- ① 显影粉 -->
  <g>
    <ellipse cx="340" cy="300" rx="42" ry="11" fill="none" stroke="#3a2b1e" stroke-width="2.5"/>
    <rect x="316" y="196" width="48" height="104" rx="8" fill="#6b4a2f" stroke="#3a2b1e" stroke-width="2"/>
    <rect x="328" y="184" width="24" height="14" fill="#c9b08a" stroke="#3a2b1e" stroke-width="2"/>
    <rect x="322" y="232" width="36" height="34" fill="#f2ead9" stroke="#8a7a5f"/>
    <text x="340" y="256" font-size="13" text-anchor="middle" fill="#4a3a26">显影粉</text>
    <text x="340" y="340" font-size="16" text-anchor="middle" fill="#3a2b1e">①</text>
  </g>
  <!-- ② 定影粉 -->
  <g>
    <ellipse cx="600" cy="300" rx="42" ry="11" fill="none" stroke="#3a2b1e" stroke-width="2.5"/>
    <rect x="576" y="196" width="48" height="104" rx="8" fill="#6b4a2f" stroke="#3a2b1e" stroke-width="2"/>
    <rect x="588" y="184" width="24" height="14" fill="#5a5a5a" stroke="#2b2b2b" stroke-width="2"/>
    <rect x="582" y="232" width="36" height="34" fill="#f2ead9" stroke="#8a7a5f"/>
    <text x="600" y="256" font-size="13" text-anchor="middle" fill="#4a3a26">定影粉</text>
    <text x="600" y="340" font-size="16" text-anchor="middle" fill="#3a2b1e">②</text>
  </g>
  <!-- ③ 急停液 -->
  <g>
    <ellipse cx="860" cy="300" rx="42" ry="11" fill="none" stroke="#3a2b1e" stroke-width="2.5"/>
    <rect x="836" y="196" width="48" height="104" rx="8" fill="#6b4a2f" stroke="#3a2b1e" stroke-width="2"/>
    <rect x="848" y="184" width="24" height="14" fill="#c9b08a" stroke="#3a2b1e" stroke-width="2"/>
    <rect x="842" y="232" width="36" height="34" fill="#e8dcc0" stroke="#8a7a5f"/>
    <text x="860" y="256" font-size="13" text-anchor="middle" fill="#4a3a26">急停液</text>
    <text x="860" y="340" font-size="16" text-anchor="middle" fill="#3a2b1e">③</text>
  </g>

  <!-- ④ 调色液·最后一张用：双圈 -->
  <g>
    <ellipse cx="318" cy="506" rx="42" ry="11" fill="none" stroke="#8a7a5f" stroke-width="2" stroke-dasharray="7 6"/>
    <ellipse cx="340" cy="506" rx="42" ry="11" fill="none" stroke="#3a2b1e" stroke-width="2.5"/>
    <rect x="316" y="402" width="48" height="104" rx="8" fill="#7a5334" stroke="#3a2b1e" stroke-width="2"/>
    <rect x="328" y="390" width="24" height="14" fill="#c9b08a" stroke="#3a2b1e" stroke-width="2"/>
    <rect x="322" y="438" width="36" height="38" fill="#fbf6e8" stroke="#b9a97f"/>
    <text x="340" y="456" font-size="11" text-anchor="middle" fill="#4a3a26">调色液</text>
    <text x="340" y="470" font-size="10" text-anchor="middle" fill="#8a5a2b">最后一张用</text>
    <text x="340" y="546" font-size="16" text-anchor="middle" fill="#3a2b1e">④</text>
    <text x="340" y="565" font-size="11" text-anchor="middle" fill="#a0522d">双圈（偏一指）</text>
  </g>
  <!-- ⑤ 调色液（旧） -->
  <g>
    <ellipse cx="600" cy="506" rx="42" ry="11" fill="none" stroke="#3a2b1e" stroke-width="2.5"/>
    <rect x="576" y="402" width="48" height="104" rx="8" fill="#6b4a2f" stroke="#3a2b1e" stroke-width="2"/>
    <rect x="588" y="390" width="24" height="14" fill="#c9b08a" stroke="#3a2b1e" stroke-width="2"/>
    <rect x="582" y="438" width="36" height="38" fill="#e6dcc2" stroke="#a89878"/>
    <text x="600" y="456" font-size="11" text-anchor="middle" fill="#5a4a36">调色液</text>
    <text x="600" y="470" font-size="10" text-anchor="middle" fill="#7a6a4f">（旧）</text>
    <text x="600" y="546" font-size="16" text-anchor="middle" fill="#3a2b1e">⑤</text>
  </g>
  <!-- ⑥ 空位（大圈） -->
  <g>
    <ellipse cx="860" cy="506" rx="58" ry="15" fill="none" stroke="#3a2b1e" stroke-width="2.5"/>
    <text x="860" y="512" font-size="12" text-anchor="middle" fill="#8a7a5f">空位</text>
    <text x="860" y="546" font-size="16" text-anchor="middle" fill="#3a2b1e">⑥</text>
    <text x="860" y="565" font-size="11" text-anchor="middle" fill="#7a6a4f">圈更大：旧配方位</text>
  </g>

  <!-- ⑦ 备用空位（小圈，下层） -->
  <g>
    <ellipse cx="340" cy="700" rx="30" ry="9" fill="none" stroke="#9a8a6f" stroke-width="2"/>
    <text x="340" y="705" font-size="11" text-anchor="middle" fill="#9a8a6f">空</text>
    <text x="340" y="736" font-size="16" text-anchor="middle" fill="#3a2b1e">⑦</text>
    <text x="340" y="755" font-size="11" text-anchor="middle" fill="#7a6a4f">备用位</text>
  </g>

  <!-- 显影台（右下示意） -->
  <rect x="700" y="650" width="330" height="64" fill="#6f5a45" stroke="#4a3626" stroke-width="2"/>
  <text x="865" y="688" font-size="14" text-anchor="middle" fill="#f0e5d6">显影台（放瓶子的地方）</text>

  <!-- 图例 -->
  <g transform="translate(60, 790)">
    <ellipse cx="18" cy="0" rx="18" ry="6" fill="none" stroke="#3a2b1e" stroke-width="2.5"/>
    <text x="46" y="5" font-size="14" fill="#3a2b1e">深圈：瓶子二十年的位置</text>

    <ellipse cx="300" cy="0" rx="18" ry="6" fill="none" stroke="#8a7a5f" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="328" y="5" font-size="14" fill="#3a2b1e">淡圈：被挪动过的旧痕迹</text>

    <ellipse cx="620" cy="0" rx="26" ry="8" fill="none" stroke="#3a2b1e" stroke-width="2"/>
    <text x="656" y="5" font-size="14" fill="#3a2b1e">大圈：空位（旧粗瓶）</text>

    <text x="900" y="5" font-size="14" fill="#7a6a4f">尺寸以模型实测为准</text>
  </g>
</svg>
