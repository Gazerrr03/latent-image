ont-size="4" fill="#3c7c64" text-anchor="middle">▲</text><text x="75.000" y="63.000" font-size="3" fill="#273b38" text-anchor="middle">净宽 3.00 m</text><text x="116.000" y="122.000" font-size="2.8" fill="#273b38" text-anchor="start">净深 4.20 m</text><text x="45.000" y="52.000" font-size="3" fill="#273b38" text-anchor="start">北：后花园（同标高）</text><text x="45.000" y="189.000" font-size="3" fill="#273b38" text-anchor="start">南：二楼横走廊</text><text x="45.000" y="197.000" font-size="2.8" fill="#273b38" text-anchor="start">西：艾瑞斯的房间；东：主楼梯</text><text x="45.000" y="205.000" font-size="2.8" fill="#273b38" text-anchor="start">N ↑　　X →　　单位：m；墙厚 0.30 m</text><text x="225.000" y="55.000" font-size="4" fill="#273b38" text-anchor="start">相机 / C1—C5</text><text x="225.000" y="68.000" font-size="2.6" fill="#273b38" text-anchor="start">C1 con_room_door-v3  (6.05, 7.4)</text><text x="225.000" y="74.000" font-size="2.6" fill="#273b38" text-anchor="start">C2 con_room_window-v3  (5.9, 10.6)</text><text x="225.000" y="80.000" font-size="2.6" fill="#273b38" text-anchor="start">C3 con_room_east-v3  (4.9, 8.0)</text><text x="225.000" y="86.000" font-size="2.6" fill="#273b38" text-anchor="start">C4 con_room_dresser_close-v3  (5.75, 9.8)</text><text x="225.000" y="92.000" font-size="2.6" fill="#273b38" text-anchor="start">C5 con_room_wardrobe_close-v3  (6.4, 7.7)</text><text x="225.000" y="104.000" font-size="4" fill="#273b38" text-anchor="start">调查物件 / ●</text><text x="225.000" y="117.000" font-size="2.65" fill="#273b38" text-anchor="start">1 hs_con_ledger (4.85, 10.65), 高 0.75</text><text x="225.000" y="123.000" font-size="2.65" fill="#273b38" text-anchor="start">2 hs_con_ringbox (4.86, 10.35), 高 0.75</text><text x="225.000" y="129.000" font-size="2.65" fill="#273b38" text-anchor="start">3 hs_con_sweater (7.30, 7.55), 高 0.20</text><text x="225.000" y="149.000" font-size="4" fill="#273b38" text-anchor="start">布置说明</text><text x="225.000" y="157.000" font-size="2.5" fill="#273b38" text-anchor="start">家具编号对应物件清单（尺寸为 X占地 × N占地 × 高）。</text><text x="225.000" y="162.000" font-size="2.5" fill="#273b38" text-anchor="start">吊灯是天花投影，不占通道。调查点 ● 不是行走终点。</text><text x="225.000" y="167.000" font-size="2.5" fill="#273b38" text-anchor="start">门开启扇形不放家具。窗帘预留墙前 0.15 m。</text><text x="225.000" y="172.000" font-size="2.5" fill="#273b38" text-anchor="start">梳妆台向北移动 0.55 m（N9.85—10.85）；北端距窗帘预留带 0.10 m。</text><text x="225.000" y="177.000" font-size="2.5" fill="#273b38" text-anchor="start">梳妆凳收进台下（X4.85—5.25，N10.05—10.55），保留从床西到梳妆台的通道</text><text x="225.000" y="182.000" font-size="2.5" fill="#273b38" text-anchor="start">。</text><text x="225.000" y="187.000" font-size="2.5" fill="#273b38" text-anchor="start">小圆桌单独定为直径 0.35 m，放在扶手椅北侧，避免两件家具共占一个 0.60 m 方框</text><text x="225.000" y="192.000" font-size="2.5" fill="#273b38" text-anchor="start">。</text><text x="225.000" y="197.000" font-size="2.5" fill="#273b38" text-anchor="start">生成提示词沿用任务书推荐摆位，建模时以此尺寸图的小幅移位为准。</text><text x="18.000" y="275.000" font-size="3" fill="#273b38" text-anchor="start">尺寸图优先于生成透视图。候选设计，待用户审查；不表示已建模或已接入游戏。</text><path d="M18 281H402" stroke="#8b9b90" stroke-width=".25"/><text x="18.000" y="288.000" font-size="2.6" fill="#273b38" text-anchor="start">2026-10-17 · T-039 v1 外壳 / T-041 家具与线索</text><text x="402.000" y="288.000" font-size="2.6" fill="#273b38" text-anchor="end">1:50 · A3 420×297mm</text></g></svg>