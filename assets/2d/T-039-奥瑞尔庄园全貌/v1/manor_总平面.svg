"0.35"/><text x="195.5" y="173.0" font-size="2.9" fill="#286e7b" text-anchor="start" font-weight="400">C4</text><path d="M105,270L105,276.8" fill="none" stroke="#6b7770" stroke-width="0.2"/><path d="M201.0,270L201.0,276.8" fill="none" stroke="#6b7770" stroke-width="0.2"/><path d="M105,276L201.0,276" fill="none" stroke="#6b7770" stroke-width="0.2"/><path d="M104,277L106,275" fill="none" stroke="#6b7770" stroke-width="0.3"/><path d="M200.0,277L202.0,275" fill="none" stroke="#6b7770" stroke-width="0.3"/><text x="153.0" y="275" font-size="3" fill="#263732" text-anchor="middle" font-weight="400">19.20 m</text><path d="M361,73L361,365" fill="none" stroke="#b3bdb3" stroke-width="0.3"/><text x="375" y="82" font-size="4.3" fill="#263732" text-anchor="start" font-weight="600">为什么必须做成坡地</text><text x="375" y="91" font-size="3.5" fill="#263732" text-anchor="start" font-weight="400">从正门进来的人，看见一栋两层宅子。</text><text x="375" y="97.2" font-size="3.5" fill="#263732" text-anchor="start" font-weight="400">从后面进来的人，直接踏上二楼。</text><text x="375" y="103.4" font-size="3.5" fill="#263732" text-anchor="start" font-weight="400">上方的暗房可以同时接触花园泥地，</text><text x="375" y="109.60000000000001" font-size="3.5" fill="#263732" text-anchor="start" font-weight="400">并与低层的餐厅形成上下声音关系。</text><text x="375" y="123.80000000000001" font-size="4.3" fill="#263732" text-anchor="start" font-weight="600">一条环线，两个到达口</text><text x="375" y="132.8" font-size="3.5" fill="#263732" text-anchor="start" font-weight="400">日常：门厅 → 楼梯 → 后门 → 花园，</text><text x="375" y="139.0" font-size="3.5" fill="#263732" text-anchor="start" font-weight="400">再经温室门外与西侧小路回前院。</text><text x="375" y="145.2" font-size="3.5" fill="#263732" text-anchor="start" font-weight="400">秘密：北侧林路 → 花园 → 温室 → 暗房。</text><text x="375" y="151.39999999999998" font-size="3.5" fill="#263732" text-anchor="start" font-weight="400">主楼与树篱遮挡前后到达视线。</text><text x="375" y="165.59999999999997" font-size="4.3" fill="#263732" text-anchor="start" font-weight="600">环境与四个人视机位</text><text x="375" y="174.59999999999997" font-size="3.5" fill="#263732" text-anchor="start" font-weight="400">C1：南门外，雨夜到达。</text><text x="375" y="180.79999999999995" font-size="3.5" fill="#263732" text-anchor="start" font-weight="400">C2：草坪相机位置，秋日下午。</text><text x="375" y="186.99999999999994" font-size="3.5" fill="#263732" text-anchor="start" font-weight="400">C3：西侧小路半坡，雨夜向北。</text><text x="375" y="193.19999999999993" font-size="3.5" fill="#263732" text-anchor="start" font-weight="400">C4：高位后花园，雨夜看通风口。</text><text x="375" y="207.39999999999992" font-size="4.3" fill="#263732" text-anchor="start" font-weight="600">场地控制</text><text x="375" y="216.39999999999992" font-size="3.5" fill="#263732" text-anchor="start" font-weight="400">西侧小路净宽 1.50 m，全程不进屋。</text><text x="375" y="222.5999999999999" font-size="3.5" fill="#263732" text-anchor="start" font-weight="400">低位厨房与高位温室分别独立落地。</text><text x="375" y="228.7999999999999" font-size="3.5" fill="#263732" text-anchor="start" font-weight="400">院墙与植物为意向；不作施工或法规依据。</text><rect x="375" y="330" width="7" height="4" fill="#e2ebdf" stroke="#cbd2c9" stroke-width="0.3"/><text x="385" y="333.4" font-size="3.1" fill="#263732" text-anchor="start" font-weight="400">可进入</text><rect x="433" y="330" width="7" height="4" fill="#f0e6cd" stroke="#cbd2c9" stroke-width="0.3"/><text x="443" y="333.4" font-size="3.1" fill="#263732" text-anchor="start" font-weight="400">只能走过</text><rect x="491" y="330" width="7" height="4" fill="#e1e2e3" stroke="#cbd2c9" stroke-width="0.3"/><text x="501" y="333.4" font-size="3.1" fill="#263732" text-anchor="start" font-weight="400">不可进入</text><path d="M375,343L393,343" fill="none" stroke="#286e7b" stroke-width="0.7" stroke-dasharray="2.5 1.5"/><text x="398" y="344" font-size="3.1" fill="#263732" text-anchor="start" font-weight="400">玩家环线</text><path d="M464,343L482,343" fill="none" stroke="#ad6845" stroke-width="0.7" stroke-dasharray="2.5 1.5"/><text x="487" y="344" font-size="3.1" fill="#263732" text-anchor="start" font-weight="400">案发前秘密路线</text><text x="375" y="354" font-size="3.1" fill="#263732" text-anchor="start" font-weight="400">× 锁门　 ━ 内侧门闩　 ◷ 钟　 ▯ 镜子</text><text x="375" y="362" font-size="3.1" fill="#ad6845" text-anchor="start" font-weight="400">设计图含剧情真相；不要直接作为玩家地图。</text><rect x="56.0" y="382" width="5.0" height="2.5" fill="#263732" stroke="#263732" stroke-width="0.2"/><rect x="61.0" y="382" width="5.0" height="2.5" fill="#faf9f5" stroke="#263732" stroke-width="0.2"/><rect x="66.0" y="382" width="5.0" height="2.5" fill="#263732" stroke="#263732" stroke-width="0.2"/><rect x="71.0" y="382" width="5.0" height="2.5" fill="#faf9f5" stroke="#263732" stroke-width="0.2"/><rect x="76.0" y="382" width="5.0" height="2.5" fill="#263732" stroke="#263732" stroke-width="0.2"/><text x="56" y="380" font-size="2.8" fill="#263732" text-anchor="start" font-weight="400">0</text><text x="81.0" y="380" font-size="2.8" fill="#263732" text-anchor="end" font-weight="400">5 m</text><text x="89.0" y="384" font-size="3" fill="#263732" text-anchor="start" font-weight="400">1:200 @ A2 / PDF 100% 打印；PNG 随缩放改变，量取以标注为准。</text><text x="337" y="76" font-size="3.8" fill="#263732" text-anchor="middle" font-weight="400">N</text><path d="M337,95L337,83" fill="none" stroke="#263732" stroke-width="0.4"/><polygon points="337,83 335,88 339,88" fill="#263732" stroke="none" stroke-width="0.3"/></g></svg>